name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"

      - name: Ruff — only crash-level rules
        run: uvx ruff check . --exclude test --select=F821,E722,F403

      - name: Compile-check — catch syntax errors
        run: python -m compileall -q -x test .

  startup:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"

      # 锁文件保留国内镜像；CI 从 PyPI 下载相同版本，并校验锁文件中的哈希。
      - name: Export locked dependencies
        run: uv export --locked --format requirements.txt --no-emit-project --output-file "$env:RUNNER_TEMP/startup-requirements.txt"

      - name: Install locked dependencies from PyPI
        run: uv pip sync --python .venv/Scripts/python.exe --require-hashes --default-index https://pypi.org/simple "$env:RUNNER_TEMP/startup-requirements.txt"

      - name: Verify main module imports
        env:
          PYTHONIOENCODING: utf-8
        run: uv run --no-sync python -c "import new_gui; print('Startup import OK')"

      - name: 4K capture, recognition and shutdown regression
        env:
          PYTHONIOENCODING: utf-8
        run: uv run --no-sync python -m test.run_4k_regression
