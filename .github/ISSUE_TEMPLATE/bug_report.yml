name: Bug 报告
description: 报告一个 Bug 以帮助我们改进
title: "[Bug] 在此简述你遇到的问题（不要留空）"
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        > :warning: **标题请勿留空或用默认文案！** 请用一两句话描述问题，例如 "[Bug] 启动时窗口闪退"。

  - type: textarea
    id: description
    attributes:
      label: 问题描述
      description: 清晰简洁地描述这个 Bug 是什么
      placeholder: 发生了一个错误...
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: 复现步骤
      description: 详细描述如何复现这个行为
      placeholder: |
        1. 前往 '...'
        2. 点击 '....'
        3. 滚动到 '....'
        4. 看到错误
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: 预期行为
      description: 清晰简洁地描述你期望发生的事情
      placeholder: 应该正常显示...
    validations:
      required: true

  - type: textarea
    id: screenshots
    attributes:
      label: 截图或录屏
      description: 拖拽或粘贴截图/录屏以帮助解释你的问题
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: 相关日志
      description: 粘贴与Bug直接相关的日志输出
      render: shell
    validations:
      required: true

  - type: textarea
    id: full_logs
    attributes:
      label: 完整日志（文件上传）
      description: 将完整日志文件拖拽到此处上传，或点击下方区域选择文件
      placeholder: 拖拽 .log 或 .txt 文件到此处
    validations:
      required: true

  - type: input
    id: os
    attributes:
      label: 操作系统
      description: 你正在使用的操作系统名称和版本
      placeholder: e.g. Windows 11
    validations:
      required: true

  - type: input
    id: python_version
    attributes:
      label: Python 版本
      description: 你正在使用的 Python 版本
      placeholder: e.g. 3.10
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: 项目版本 / Commit
      description: 你正在使用的项目版本或 Git Commit
      placeholder: e.g. v1.0.0 或 abc1234
    validations:
      required: true
